name: simhammer

services:
  backend:
    build:
      context: backend
      dockerfile: server/Dockerfile
      args:
        - SIMC_BRANCH=${SIMC_BRANCH:-weekly}
        - SIMC_VERSION=${SIMC_VERSION:-}
    ports:
      - "8000:8000"
    volumes:
      - simhammer-db:/app/db
    environment:
      - DATA_DIR=/app/resources/data
      - DATABASE_URL=/app/db/simhammer.db
      - PORT=8000
      - MAX_COMBINATIONS=2
      - MAX_SCENARIOS=0

  frontend:
    build:
      context: frontend
      args:
        - NEXT_PUBLIC_API_URL=${SERVER_IP:-http://localhost:8000}
    ports:
      - "3000:3000"

  resources:
    profiles: ["desktop"]
    build:
      context: desktop
      dockerfile: Dockerfile.resources
    volumes:
      - ./backend/resources/data:/mount/data
    entrypoint: ["sh", "-c", "cp -r /out/data/* /mount/data/ && echo 'Resources ready.'"]


volumes:
  simhammer-db:
